<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ephi test feed</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #000; color: #e7e9ea; max-width: 600px; margin: 0 auto; padding: 20px; }
    .post { border: 1px solid #2f3336; border-radius: 12px; padding: 16px; margin: 16px 0; }
    .author { font-weight: 700; margin-bottom: 8px; }
    .author small { color: #71767b; font-weight: 400; }
    .hint { color: #71767b; }
  </style>
</head>
<body>
  <h2>Ephi test feed</h2>
  <p class="hint">Each post contains a &lt;blk URL blk&gt; tag. With the Ephi extension loaded, they render as widgets.</p>

  <div class="post"><div class="author">Swap <small>@ephi</small></div><span>Swap here: &lt;blk /swap blk&gt;</span></div>
  <div class="post"><div class="author">Bridge <small>@ephi</small></div><span>Bridge via CCIP: &lt;blk /bridge blk&gt;</span></div>
  <div class="post"><div class="author">Donation <small>@ephi</small></div><span>Support us: &lt;blk /donation blk&gt;</span></div>
  <div class="post"><div class="author">Faucet <small>@ephi</small></div><span>Grab tokens: &lt;blk /faucet blk&gt;</span></div>

  <script>
    // Point the tags at whatever host/port this server is running on
    document.querySelectorAll("span").forEach((span) => {
      span.innerHTML = span.innerHTML.replace(/&lt;blk \/(\w+) blk&gt;/g, `&lt;blk ${location.origin}/$1 blk&gt;`);
    });
  </script>
</body>
</html>
